<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" />
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>Rock-Paper-Scissors</h1>
            <p>The classic game of Rock, Paper, Scissors!</p>
        </header>

        <div class="hud">
            <div class="hud-card">
                <div class="hud-label">Your Score</div>
                <div class="hud-value" id="score-display">0</div>
            </div>

            <div class="timer-pill" id="timer-pill">
                <div class="hud-label">Time Left</div>
                <div id="timer-display">2:00</div>
            </div>

            <div class="hud-card">
                <div class="hud-label">Your Earnings</div>
                <div class="hud-value" id="earnings-display">$0</div>
            </div>
        </div>

        <div class="arena" id="arena">
            <div class="fighter" id="player">
                <div class="fighter-label">You</div>
                <div class="fighter-icon" id="player-icon">❓</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="fighter" id="computer">
                <div class="fighter-label">Computer</div>
                <div class="fighter-icon" id="computer-icon" style="transform: scaleX(-1);">❓</div>
            </div>
            <div class="result-banner" id="result-banner">
                <div class="result-text" id="result-text"></div>
                <div class="result-sub" id="result-sub"></div>
            </div>
        </div>

        <div class="choices">
            <button class="choice-btn" data-choice="rock" disabled>
                <span class="choice-icon">✊</span>
                <span class="choice-name">Rock</span>
            </button>
            <button class="choice-btn" data-choice="paper" disabled>
                <span class="choice-icon">🖐️</span>
                <span class="choice-name">Paper</span>
            </button>
            <button class="choice-btn" data-choice="scissors" disabled>
                <span class="choice-icon">✌️</span>
                <span class="choice-name">Scissors</span>
            </button>
        </div>

        <div class="start-section">
            <button id="start-btn">▶ Start Game</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-emoji" id="modal-emoji">🏆</div>
            <div class="modal-title" id="modal-title">Time's Up!</div>
            <div class="modal-subtitle">Here's how you did</div>
            <div class="modal-earnings" id="modal-earnings">$0</div>
            <div class="modal-score-line" id="modal-score-line">Final Score: 0 points</div>
            <button class="modal-btn" id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
